<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>InSituExperiment dataset-level operations</title>
<desc>Diagram showing the four InSituExperiment methods that mutate the
dataset list: add, replace, remove, and concat.</desc>

<style>
  :root {
    --bg: #ffffff;
    --fg: #2C2C2A;
    --fg2: #5F5E5A;
    --fg3: #888780;
    --border: rgba(0,0,0,0.15);
    --bg2: #F1EFE8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --fg: #D3D1C7;
      --fg2: #B4B2A9;
      --fg3: #888780;
      --border: rgba(255,255,255,0.15);
      --bg2: #2C2C2A;
    }
    .fill-purple { fill: #3C3489; stroke: #AFA9EC; }
    .fill-teal   { fill: #085041; stroke: #5DCAA5; }
    .fill-green  { fill: #27500A; stroke: #97C459; }
    .fill-blue   { fill: #0C447C; stroke: #85B7EB; }
    .fill-coral  { fill: #712B13; stroke: #F0997B; }
    .fill-gray   { fill: #2C2C2A; stroke: #B4B2A9; }
    .t-purple  { fill: #CECBF6; }
    .t-teal    { fill: #9FE1CB; }
    .t-green   { fill: #C0DD97; }
    .t-blue    { fill: #B5D4F4; }
    .t-coral   { fill: #F5C4B3; }
    .t-gray    { fill: #D3D1C7; }
    .ts-purple { fill: #AFA9EC; }
    .ts-teal   { fill: #5DCAA5; }
    .ts-green  { fill: #97C459; }
    .ts-blue   { fill: #85B7EB; }
    .ts-coral  { fill: #F0997B; }
    .ts-gray   { fill: #B4B2A9; }
  }
  .fill-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .fill-teal   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .fill-green  { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
  .fill-blue   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .fill-coral  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .fill-gray   { fill: var(--bg2); stroke: var(--border); stroke-width: 0.5; }
  .t-purple  { fill: #3C3489; }
  .t-teal    { fill: #085041; }
  .t-green   { fill: #27500A; }
  .t-blue    { fill: #042C53; }
  .t-coral   { fill: #712B13; }
  .t-gray    { fill: var(--fg); }
  .ts-purple { fill: #534AB7; }
  .ts-teal   { fill: #0F6E56; }
  .ts-green  { fill: #3B6D11; }
  .ts-blue   { fill: #185FA5; }
  .ts-coral  { fill: #993C1D; }
  .ts-gray   { fill: var(--fg2); }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: var(--fg3); stroke-width: 1.5; fill: none; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Centre box: InSituExperiment -->
<rect class="fill-purple" x="250" y="75" width="180" height="110" rx="14"/>
<text class="th t-purple" x="340" y="120" text-anchor="middle" dominant-baseline="central">InSituExperiment</text>
<text class="ts ts-purple" x="340" y="142" text-anchor="middle" dominant-baseline="central">dataset list</text>

<!-- Top-left: add() -->
<rect class="fill-green" x="30" y="75" width="178" height="55" rx="8"/>
<text class="th t-green" x="119" y="96" text-anchor="middle" dominant-baseline="central">add(path_or_data)</text>
<text class="ts ts-green" x="119" y="115" text-anchor="middle" dominant-baseline="central">Load &amp; register a new dataset</text>

<!-- Bottom-left: concat() -->
<rect class="fill-blue" x="30" y="170" width="178" height="55" rx="8"/>
<text class="th t-blue" x="119" y="191" text-anchor="middle" dominant-baseline="central">concat([exp1, exp2])</text>
<text class="ts ts-blue" x="119" y="210" text-anchor="middle" dominant-baseline="central">Merge multiple experiments</text>

<!-- Top-right: remove() -->
<rect class="fill-coral" x="472" y="75" width="178" height="55" rx="8"/>
<text class="th t-coral" x="561" y="96" text-anchor="middle" dominant-baseline="central">remove(idx)</text>
<text class="ts ts-coral" x="561" y="115" text-anchor="middle" dominant-baseline="central">Drop a dataset</text>

<!-- Bottom-right: replace() -->
<rect class="fill-teal" x="472" y="170" width="178" height="55" rx="8"/>
<text class="th t-teal" x="561" y="191" text-anchor="middle" dominant-baseline="central">replace(idx, new_data)</text>
<text class="ts ts-teal" x="561" y="210" text-anchor="middle" dominant-baseline="central">Swap a dataset in-place</text>

<!-- Arrow: add() -> experiment -->
<line x1="209" y1="102" x2="248" y2="115"
      class="arr" stroke="#3B6D11" marker-end="url(#arrow)"/>

<!-- Arrow: concat() -> experiment -->
<line x1="209" y1="197" x2="248" y2="155"
      class="arr" stroke="#185FA5" marker-end="url(#arrow)"/>

<!-- Arrow: experiment -> remove() -->
<line x1="431" y1="115" x2="470" y2="102"
      class="arr" stroke="#993C1D" marker-end="url(#arrow)"/>

<!-- Arrow: replace() <-> experiment (bidirectional) -->
<line x1="431" y1="155" x2="470" y2="197"
      class="arr" stroke="#0F6E56" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

</svg>
