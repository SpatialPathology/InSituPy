version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.13"

python:
  install:
    - method: pip
      path: .
      # api.md documents insitupy.spatialdata; Sphinx >= 9 aborts the build when an
      # autosummary entry cannot be imported, so the optional extra must be installed.
      extra_requirements:
        - spatialdata
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
