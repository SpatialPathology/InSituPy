[project]
name = "insitupy-spatial"
version = "0.12.0b8"
description = "Package introducing the InSituPy framework to analyze single-cell spatial transcriptomics data."
license = "BSD-3-Clause"
authors = [
    {name = "Johannes Wirth", email = "jwrth <j.wirth@tum.de>"}
]
requires-python = ">=3.12.0,<4.0"
readme = "README.md"
dependencies = [
    "scanpy[leiden] (>=1.10.3,<2.0.0)",
    # 0.13 moved X into layers[None] (X itself is unaffected, still a normal attribute).
    # InSituPy filters that key out (insitupy/utils/_adata.py::_layer_names) and is green on
    # 0.13.2, but the bound is held here deliberately: 0.13.2's headline fix ("keep X when
    # clearing/reassigning layers", six days after 0.13.0) warns semantics may still change,
    # and floats a not-yet-landed layers.clear(keep_x=...) API. Widen to <0.14 once upstream
    # settles - a one-line change plus a re-run of the dual-env (0.12/0.13) verification in
    # .log/reports/260717/anndata-013-layers-fix/report-anndata-013-layers-fix.md. Also
    # evaluate the anndata 0.14 allow_write_nullable_strings -> True flip before going further.
    "anndata (>=0.12.0,<0.13)",
    "numpy (>=2.1.3,<3.0.0)",
    "dask>=2025.3.0",
    "dask-image>=2023.8.1",
    # 0.6.3+ had a lasso-tool edge_width reset bug (napari/napari#8273), fixed in 0.7.0
    # (napari/napari#8414, merged 2025-12-09). Validated on 0.7.1 2026-07-07, including a
    # transcript-viewer thread-race and a canvas_size_limits border-rendering regression
    # found and fixed along the way — see
    # .log/reports/260706/transcript-viewer-race-fix/report-transcript-viewer-race-fix.md
    "napari[all] (>=0.7.0,<0.8.0)",
    "parse>=1.19.1",
    "opencv-python>=4.8.0.76",
    "scikit-image (>=0.21.0,<1.0.0)",
    "scipy (>=1.14,<1.17.0)",
    "pandas (>=1.5.0,<3.0.0)",
    "geopandas>=1.0.1",
    # "fiona>=1.10.1",
    "openpyxl (>=3.1.2,<4.0.0)",
    "xmltodict>=0.13.0",
    "zarr (>=3.2.1,<4.0.0)",
    # <2026.5.2 imports zarr.core.chunk_grids.RegularChunkGrid, removed in zarr's 3.2.0
    # ChunkGrid refactor -> ImportError on aszarr=True reads. 2026.5.2 reworked ZarrTiffStore
    # for the new API and requires zarr>=3.2.0.
    "tifffile (>=2026.5.2,<2027.0.0)",
    "pyarrow (>=14.0.1,<=21.0.0)", # 22.0.0 causes issues reading cell.parquet
    "fastparquet>=2023.10.1",
    "toml (>=0.10.2,<1.0.0)",
    "plottable==0.1.5",
    "adjusttext (>=1.3.0,<2.0.0)",
    "scikit-misc>=0.3.1",
    "dask-geopandas>=0.4.2",
    "imagecodecs>=2024.12.30",
    "rasterio>=1.4.3",
    "requests",
    "decoupler (>=2.1.1,<3.0.0)",
    # security patches
    "tornado>=6.5.7", # https://github.com/advisories/GHSA-3x9g-8vmp-wqvf
    "urllib3>=2.7.0", # GHSA-2xpw-w6gg-jr37
    "pillow>=12.3.0" # GHSA-3f63-hfp8-52jq
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-qt>=4.2.0"]
spatialdata = [
    "spatialdata[extra]>=0.8.0,<0.9.0",
    "spatialdata-io"
]
mcp = ["mcp[cli]>=1.0.0,<2.0.0"]

[project.scripts]
insitupy-mcp = "mcp_server:main"
insitupy = "insitupy._ai.cli:main"

[tool.poetry]
packages =[
    { include = 'insitupy' },
    { include = 'mcp_server', from = 'tools' }
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common bugs/design issues)
    "NPY", # numpy-specific rules
]