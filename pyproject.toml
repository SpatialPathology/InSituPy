[project]
name = "insitupy-spatial"
version = "0.12.0b4"
description = "Package introducing the InSituPy framework to analyze single-cell spatial transcriptomics data."
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Johannes Wirth", email = "jwrth <j.wirth@tum.de>"}
]
requires-python = ">=3.11.0"
readme = "README.md"
dependencies = [
    "scanpy[leiden] (>=1.10.3,<2.0.0)",
    "anndata>=0.12.0",
    "numpy (>=2.1.3,<3.0.0)",
    "dask>=2025.3.0",
    "dask-image>=2023.8.1",
    # starting from 0.6.3 there are some issues with adding annotations in napari
    # See: https://github.com/napari/napari/issues/8273
    # Is supposed to be fixed in 0.7.0: https://github.com/napari/napari/pull/8414
    "napari[all] (>=0.5.6,<0.6.3)",
    "parse>=1.19.1",
    "opencv-python>=4.8.0.76",
    "scikit-image (>=0.21.0,<1.0.0)",
    "scipy (>=1.14,<1.17.0)",
    "pandas (>=1.5.0,<3.0.0)",
    "geopandas>=1.0.1",
    # "fiona>=1.10.1",
    "openpyxl (>=3.1.2,<4.0.0)",
    "xmltodict>=0.13.0",
    "zarr (>=3.2.1,<4.0.0)",
    # <2026.5.2 imports zarr.core.chunk_grids.RegularChunkGrid, removed in zarr's 3.2.0
    # ChunkGrid refactor -> ImportError on aszarr=True reads. 2026.5.2 reworked ZarrTiffStore
    # for the new API and requires zarr>=3.2.0.
    "tifffile (>=2026.5.2,<2027.0.0)",
    "pyarrow (>=14.0.1,<=21.0.0)", # 22.0.0 causes issues reading cell.parquet
    "fastparquet>=2023.10.1",
    "toml (>=0.10.2,<1.0.0)",
    "plottable==0.1.5",
    "adjusttext (>=1.3.0,<2.0.0)",
    "scikit-misc>=0.3.1",
    "dask-geopandas>=0.4.2",
    "imagecodecs>=2024.12.30",
    "rasterio>=1.4.3",
    "requests",
    "decoupler (>=2.1.1,<3.0.0)",
    # security patches
    "tornado>=6.5.0",
    "urllib3>=2.6.0" # https://github.com/SpatialPathology/InSituPy/security/dependabot/31
]

[project.optional-dependencies]
dev = ["pytest>=7.4.2", "pytest-qt>=4.2.0"]
spatialdata = [
    "spatialdata[extra]>=0.7.2",
    "spatialdata-io"
]
mcp = ["mcp[cli]>=1.0.0"]

[project.scripts]
insitupy-mcp = "mcp_server:main"

[tool.poetry]
packages =[
    { include = 'insitupy' },
    { include = 'mcp_server', from = 'tools' }
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common bugs/design issues)
    "NPY", # numpy-specific rules
]