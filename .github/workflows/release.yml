name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '[ab]|rc'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install "poetry==2.4.1"

      - name: Check poetry.lock is in sync with pyproject.toml
        run: poetry check --lock --strict

      - name: Install tagged package for skill-reference introspection
        run: pip install ".[mcp,spatialdata]"

      - name: Regenerate skill reference + llms.txt
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/generate_skill_reference.py

      - name: Symbol drift gate
        run: python tools/generate_skill_reference.py --check-symbols

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        run: poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}

      - name: Build skill ZIP asset
        run: |
          mkdir -p dist "$RUNNER_TEMP/skill-zip/insitupy"
          cp -r insitupy/_ai/skill/. "$RUNNER_TEMP/skill-zip/insitupy/"
          (cd "$RUNNER_TEMP/skill-zip" && zip -r "$GITHUB_WORKSPACE/dist/insitupy-skill-${{ github.ref_name }}.zip" insitupy)
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: dist/*
