name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  # Creates the GitHub release. No id-token: publishing uses PYPI_TOKEN, not
  # trusted publishing.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Deployment gate: the job waits until a maintainer approves it, and the
    # environment only accepts version tags. PYPI_TOKEN lives in this
    # environment, so no other workflow can read it.
    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '[ab]|rc'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install "poetry==2.4.1"

      - name: Check poetry.lock is in sync with pyproject.toml
        run: poetry check --lock --strict

      - name: Install tagged package for skill-reference introspection
        # Install from poetry.lock (validated by the gate above) instead of a fresh
        # `pip install .[...]` resolve, so the environment that generates the skill
        # reference matches the locked dependency set. A bare pip resolve here let an
        # unbounded upstream slip in at release time (this is what broke 0.12.0b8).
        run: poetry install --extras "mcp spatialdata"

      - name: Regenerate skill reference + llms.txt
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run python tools/generate_skill_reference.py

      - name: Symbol drift gate
        run: poetry run python tools/generate_skill_reference.py --check-symbols

      - name: Call-binding gate
        run: poetry run python tools/generate_skill_reference.py --check-calls

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        run: poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}

      - name: Build skill ZIP asset
        run: |
          mkdir -p dist "$RUNNER_TEMP/skill-zip/insitupy-api"
          cp -r insitupy/_ai/skill/. "$RUNNER_TEMP/skill-zip/insitupy-api/"
          (cd "$RUNNER_TEMP/skill-zip" && zip -r "$GITHUB_WORKSPACE/dist/insitupy-api-${{ github.ref_name }}.zip" insitupy-api)
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: dist/*
